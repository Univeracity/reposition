name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: python -m build
      - run: python scripts/check_dist.py
      - run: python scripts/smoke_wheel.py dist/*.whl
  optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,tokens,tfidf]'
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/evaluate.py examples/github-cache.json examples/cases.json --format github --repo example/packages --methods fts5 tfidf
